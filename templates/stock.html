<!DOCTYPE html>
<html>
<head><title>Stock Management</title></head>
<body>
<h1>Stock Management</h1>
<form method="POST">
    <input type="hidden" name="action" value="add">
    Name: <input type="text" name="name"><br>
    Price: <input type="number" step="0.01" name="price"><br>
    Quantity: <input type="number" name="quantity"><br>
    <input type="submit" value="Add Item">
</form>
<h2>Items</h2>
<table border="1">
    <tr><th>ID</th><th>Name</th><th>Price</th><th>Quantity</th><th>Actions</th></tr>
    {% for item in items %}
    <tr>
        <td>{{ item.id }}</td>
        <td>{{ item.name }}</td>
        <td>{{ item.price }}</td>
        <td>{{ item.quantity }}</td>
        <td>
            <form method="POST" style="display:inline;">
                <input type="hidden" name="action" value="update">
                <input type="hidden" name="id" value="{{ item.id }}">
                <input type="text" name="name" value="{{ item.name }}" size="10">
                <input type="number" step="0.01" name="price" value="{{ item.price }}" size="5">
                <input type="number" name="quantity" value="{{ item.quantity }}" size="5">
                <input type="submit" value="Update">
            </form>
            <form method="POST" style="display:inline;">
                <input type="hidden" name="action" value="delete">
                <input type="hidden" name="id" value="{{ item.id }}">
                <input type="submit" value="Delete">
            </form>
        </td>
    </tr>
    {% endfor %}
</table>
<a href="{{ url_for('logout') }}">Logout</a>
</body>
</html>
